<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cizre Ejderi - Giriş & Doğrulama</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #334155; text-align: center; }
    h1 { color: #f59e0b; margin-bottom: 8px; font-size: 24px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
    input:focus { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.3); }
    button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #f59e0b; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 8px; }
    button:hover { background: #d97706; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Cizre Ejderi Portal</h1>
    <p>Doğrulama kodu almak için e-posta adresinizi girin.</p>

    <!-- STEP 1: EMAIL INPUT -->
    <div id="step-email">
      <div class="form-group">
        <label for="email">E-Posta Adresi</label>
        <input type="email" id="email" placeholder="ornek@mail.com" required>
      </div>
      <button id="send-btn" onclick="sendCode()">Kod Gönder</button>
    </div>

    <!-- STEP 2: CODE VERIFICATION -->
    <div id="step-code" class="hidden">
      <div class="form-group">
        <label for="code">6 Haneli Doğrulama Kodu</label>
        <input type="text" id="code" maxlength="6" placeholder="123456" required style="text-align: center; letter-spacing: 4px; font-weight: bold;">
      </div>
      <button id="verify-btn" onclick="verifyCode()">Giriş Yap</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    let generatedCode = '';
    let targetEmail = '';

    async function sendCode() {
      const emailInput = document.getElementById('email').value.trim();
      const statusDiv = document.getElementById('status');
      const sendBtn = document.getElementById('send-btn');

      if (!emailInput || !emailInput.includes('@')) {
        statusDiv.className = 'status error';
        statusDiv.innerText = 'Lütfen geçerli bir e-posta girin.';
        return;
      }

      targetEmail = emailInput;
      generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

      statusDiv.className = 'status';
      statusDiv.innerText = 'Kod gönderiliyor...';
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: targetEmail, code: generatedCode })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          statusDiv.className = 'status success';
          statusDiv.innerText = 'Doğrulama kodu e-posta adresinize gönderildi!';
          document.getElementById('step-email').classList.add('hidden');
          document.getElementById('step-code').classList.remove('hidden');
        } else {
          throw new Error(result.error || 'Mail gönderimi başarısız.');
        }
      } catch (err) {
        statusDiv.className = 'status error';
        statusDiv.innerText = err.message;
        sendBtn.disabled = false;
      }
    }

    function verifyCode() {
      const inputCode = document.getElementById('code').value.trim();
      const statusDiv = document.getElementById('status');

      if (inputCode === generatedCode) {
        statusDiv.className = 'status success';
        statusDiv.innerText = 'Giriş başarılı! Cizre Ejderi sistemine hoş geldiniz.';
      } else {
        statusDiv.className = 'status error';
        statusDiv.innerText = 'Hatalı kod! Lütfen tekrar kontrol edin.';
      }
    }
  </script>
</body>
</html>
