<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cizre Ejderi - Üyelik Paneli</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 420px; border: 1px solid #334155; }
    h1 { color: #f59e0b; margin-bottom: 8px; font-size: 24px; text-align: center; }
    p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; text-align: center; }
    
    .mode-selector { display: flex; gap: 6px; margin-bottom: 24px; background: #0f172a; padding: 6px; border-radius: 10px; border: 1px solid #334155; }
    .mode-btn { flex: 1; padding: 10px 4px; border: none; background: transparent; color: #94a3b8; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 12px; }
    .mode-btn.active { background: #f59e0b; color: #0f172a; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }

    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; outline: none; transition: 0.3s; }
    input:focus { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.3); }
    
    button.main-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #f59e0b; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
    button.main-btn:hover { background: #d97706; }
    
    .status { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .hidden { display: none !important; }

    .dashboard { text-align: center; }
    .avatar { width: 80px; height: 80px; background: #f59e0b; color: #0f172a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 16px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }
    .user-box { background: #0f172a; padding: 16px; border-radius: 10px; margin-bottom: 20px; text-align: left; border: 1px solid #334155; }
    .user-box div { margin-bottom: 10px; font-size: 14px; color: #94a3b8; }
    .user-box span { color: #f59e0b; font-weight: bold; float: right; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
    .logout-btn:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <div id="auth-box">
      <h1>Cizre Ejderi Portal</h1>
      <p class="subtitle" id="form-subtitle">Devam etmek için bir işlem seçin.</p>

      <div class="mode-selector">
        <button id="tab-login" class="mode-btn active" onclick="switchMode('login')">Giriş Yap</button>
        <button id="tab-register" class="mode-btn" onclick="switchMode('register')">Kayıt Ol</button>
        <button id="tab-reset" class="mode-btn" onclick="switchMode('reset')">Şifremi Unuttum</button>
      </div>

      <div id="form-content">
        <!-- Ad Soyad (Sadece Kayıt) -->
        <div class="form-group hidden" id="group-fullname">
          <label for="fullname">Ad Soyad</label>
          <input type="text" id="fullname" placeholder="Ahmet Yılmaz">
        </div>

        <!-- Kullanıcı Adı (Ortak) -->
        <div class="form-group" id="group-username">
          <label for="username">Kullanıcı Adı</label>
          <input type="text" id="username" placeholder="cizreli73">
        </div>

        <!-- Telefon Numarası (Kayıt ve Şifre Sıfırlama) -->
        <div class="form-group hidden" id="group-phone">
          <label for="phone">Telefon Numarası</label>
          <input type="text" id="phone" placeholder="05xxxxxxxxx">
        </div>

        <!-- Şifre (Giriş ve Kayıt) -->
        <div class="form-group" id="group-password">
          <label for="password">Şifre</label>
          <input type="password" id="password" placeholder="******">
        </div>

        <!-- Yeni Şifre (Şifremi Unuttum) -->
        <div class="form-group hidden" id="group-new-password">
          <label for="new-password">Yeni Şifre</label>
          <input type="password" id="new-password" placeholder="Yeni Şifrenizi Girin">
        </div>

        <button class="main-btn" id="submit-btn" onclick="handleAuth()">Giriş Yap</button>
      </div>
    </div>

    <!-- PROFİL PANELİ -->
    <div id="dashboard-box" class="dashboard hidden">
      <div class="avatar" id="profile-avatar">C</div>
      <h2 style="color: #f59e0b; margin-bottom: 6px;">Hoş Geldin!</h2>
      <p class="subtitle" style="margin-bottom: 20px;">Sisteme başarıyla giriş yaptın.</p>
      
      <div class="user-box">
        <div>Ad Soyad: <span id="dash-fullname">-</span></div>
        <div>Kullanıcı Adı: <span id="dash-username">-</span></div>
        <div>Telefon: <span id="dash-phone">-</span></div>
      </div>

      <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script>
    let currentMode = 'login';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('status').innerText = '';
      
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const tabReset = document.getElementById('tab-reset');
      
      const gFullname = document.getElementById('group-fullname');
      const gUsername = document.getElementById('group-username');
      const gPhone = document.getElementById('group-phone');
      const gPassword = document.getElementById('group-password');
      const gNewPassword = document.getElementById('group-new-password');
      
      const subtitle = document.getElementById('form-subtitle');
      const submitBtn = document.getElementById('submit-btn');

      tabLogin.classList.remove('active');
      tabRegister.classList.remove('active');
      tabReset.classList.remove('active');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        gFullname.classList.add('hidden');
        gUsername.classList.remove('hidden');
        gPhone.classList.add('hidden');
        gPassword.classList.remove('hidden');
        gNewPassword.classList.add('hidden');
        subtitle.innerText = 'Hesabınıza giriş yapmak için bilgilerinizi girin.';
        submitBtn.innerText = 'Giriş Yap';
      } else if (mode === 'register') {
        tabRegister.classList.add('active');
        gFullname.classList.remove('hidden');
        gUsername.classList.remove('hidden');
        gPhone.classList.remove('hidden');
        gPassword.classList.remove('hidden');
        gNewPassword.classList.add('hidden');
        subtitle.innerText = 'Yeni hesap oluşturmak için formu doldurun.';
        submitBtn.innerText = 'Kayıt Ol';
      } else if (mode === 'reset') {
        tabReset.classList.add('active');
        gFullname.classList.add('hidden');
        gUsername.classList.remove('hidden');
        gPhone.classList.remove('hidden');
        gPassword.classList.add('hidden');
        gNewPassword.classList.remove('hidden');
        subtitle.innerText = 'Kullanıcı adı ve kayıtlı telefon numaranızı girerek şifrenizi yenileyin.';
        submitBtn.innerText = 'Şifreyi Güncelle';
      }
    }

    function handleAuth() {
      const statusDiv = document.getElementById('status');

      if (currentMode === 'register') {
        const fullname = document.getElementById('fullname').value.trim();
        const username = document.getElementById('username').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!fullname || !username || !phone || !password) {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Lütfen tüm alanları doldurun.';
          return;
        }

        const newUser = { fullname, username, phone, password };
        localStorage.setItem('cizre_user', JSON.stringify(newUser));

        statusDiv.className = 'status success';
        statusDiv.innerText = 'Kayıt başarılı! Giriş yapılıyor...';
        setTimeout(() => openDashboard(newUser), 1000);

      } else if (currentMode === 'reset') {
        const username = document.getElementById('username').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const newPassword = document.getElementById('new-password').value.trim();
        const savedUserJson = localStorage.getItem('cizre_user');

        if (!username || !phone || !newPassword) {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Lütfen Kullanıcı Adı, Telefon ve Yeni Şifreyi girin.';
          return;
        }

        if (!savedUserJson) {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Sistemde kayıtlı hesap bulunamadı.';
          return;
        }

        let user = JSON.parse(savedUserJson);
        // Güvenlik Kontrolü: Hem kullanıcı adı hem de telefon birebir eşleşmeli
        if (user.username === username && user.phone === phone) {
          user.password = newPassword;
          localStorage.setItem('cizre_user', JSON.stringify(user));

          statusDiv.className = 'status success';
          statusDiv.innerText = 'Şifreniz güncellendi! Yeni şifrenizle giriş yapabilirsiniz.';
          switchMode('login');
        } else {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Kullanıcı adı ile telefon numarası eşleşmiyor!';
        }

      } else {
        // GİRİŞ YAP
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const savedUserJson = localStorage.getItem('cizre_user');

        if (!username || !password) {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Kullanıcı adı ve şifrenizi girin.';
          return;
        }

        if (!savedUserJson) {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Kayıtlı hesap bulunamadı. Önce Kayıt Olun!';
          return;
        }

        const user = JSON.parse(savedUserJson);
        if (user.username === username && user.password === password) {
          statusDiv.className = 'status success';
          statusDiv.innerText = 'Giriş başarılı!';
          openDashboard(user);
        } else {
          statusDiv.className = 'status error';
          statusDiv.innerText = 'Hatalı kullanıcı adı veya şifre!';
        }
      }
    }

    function openDashboard(user) {
      document.getElementById('auth-box').classList.add('hidden');
      document.getElementById('dashboard-box').classList.remove('hidden');
      document.getElementById('status').innerText = '';

      document.getElementById('dash-fullname').innerText = user.fullname;
      document.getElementById('dash-username').innerText = '@' + user.username;
      document.getElementById('dash-phone').innerText = user.phone;
      document.getElementById('profile-avatar').innerText = user.fullname.charAt(0).toUpperCase();
    }

    function logout() {
      document.getElementById('dashboard-box').classList.add('hidden');
      document.getElementById('auth-box').classList.remove('hidden');
      switchMode('login');
    }
  </script>
</body>
</html>
